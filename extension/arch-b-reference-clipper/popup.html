<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARCH-B Reference Clipper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <p class="eyebrow">ARCH-B</p>
          <h1>Reference Clipper</h1>
        </div>
        <button id="refreshPage" class="icon-button" type="button" title="현재 탭 다시 읽기">↻</button>
      </header>

      <section id="connectPanel" class="panel hidden">
        <p class="panel-title">확장자 연결이 필요합니다.</p>
        <p class="muted">ARCH-B에 로그인한 뒤 연결 페이지를 열면 자동으로 연결됩니다.</p>
        <label>
          <span>ARCH-B URL</span>
          <div class="inline-field">
            <input id="connectBaseUrl" type="url" placeholder="https://www.archbehind.com" />
            <button id="saveConnectBaseUrl" type="button">저장</button>
          </div>
        </label>
        <button id="connectButton" class="primary-button" type="button">ARCH-B 연결하기</button>
        <details class="manual-token">
          <summary>토큰 직접 입력</summary>
          <textarea id="manualToken" rows="3" placeholder="연결 페이지에서 복사한 토큰"></textarea>
          <button id="saveTokenButton" class="secondary-button" type="button">토큰 저장</button>
        </details>
      </section>

      <section id="formPanel" class="panel">
        <label>
          <span>ARCH-B URL</span>
          <div class="inline-field">
            <input id="baseUrl" type="url" placeholder="https://www.archbehind.com" />
            <button id="saveBaseUrl" type="button">저장</button>
          </div>
        </label>

        <label>
          <span>제목</span>
          <input id="title" type="text" />
        </label>

        <label>
          <span>URL</span>
          <input id="url" type="url" />
        </label>

        <label>
          <span>설명</span>
          <textarea id="description" rows="4"></textarea>
        </label>

        <label>
          <span>카테고리</span>
          <select id="category"></select>
        </label>

        <div class="preview">
          <div class="preview-image">
            <img id="previewImage" alt="" />
          </div>
          <div>
            <p id="previewTitle" class="preview-title">현재 페이지</p>
            <p id="previewUrl" class="preview-url"></p>
          </div>
        </div>

        <button id="saveReference" class="primary-button" type="button">ARCH-B에 저장</button>
        <button id="clearToken" class="text-button" type="button">연결 해제</button>
      </section>

      <p id="status" class="status"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
